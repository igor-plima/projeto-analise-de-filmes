spring.application.name=cinema-avaliacoes
server.port=8080
spring.thymeleaf.cache=false

# --- Banco de dados (MySQL) ---
# Credenciais lidas de variaveis de ambiente; os valores apos ":" sao apenas padroes de desenvolvimento.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cinema}?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:cinema_app}
spring.datasource.password=${DB_PASSWORD:Cinema_Dev_7Kq2xP}

# O banco e criado pelo script banco/script-cinema.sql; o Hibernate apenas VALIDA a estrutura.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# --- Seguranca: nao expor detalhes internos nas respostas de erro ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
